name: Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: storemesh-bff
      - uses: actions/checkout@v4
        with:
          repository: sartim/storemesh-order-service
          path: storemesh-order-service
      - uses: actions/checkout@v4
        with:
          repository: sartim/storemesh-product-service
          path: storemesh-product-service
      - uses: actions/checkout@v4
        with:
          repository: sartim/storemesh-inventory-service
          path: storemesh-inventory-service
      - uses: actions/checkout@v4
        with:
          repository: sartim/storemesh-user-service
          path: storemesh-user-service
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="${REF_NAME#v}"; fi
          case "$version" in
            *[!A-Za-z0-9._-]*|'') echo "invalid image version" >&2; exit 1 ;;
          esac
          echo "image-tag=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: storemesh-bff/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.image-tag }}
          provenance: mode=max
          sbom: true

  kind-smoke:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: sartim/storemesh-helm-repo/.github/workflows/kind-smoke.yml@main
    with:
      chart: storemesh-bff
      image_tag: ${{ needs.publish.outputs.image-tag }}
    secrets: inherit
